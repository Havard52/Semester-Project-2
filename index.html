<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANS | Auction Network Society</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="src/scss/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="fixed-top  text-white p-3 d-flex justify-content-between align-items-center">
    <a href="index.html" id="logo"><h1>ANS</h1></a>
        <form id="filterForm" class="d-flex align-items-center">
        <select id="filterSelect" class="form-select me-2">
            <option value="newest">Newest</option>
            <option value="endsSoon">Ends soon</option>
            <option value="user">User</option>
        </select>
        <input type="text" id="userSearchInput" class="form-control me-2" placeholder="Search by username">
        <button type="submit" class="btn btn-primary">Filter</button>
        </form>
    <div id="user-info">
      <a href="login.html" id="login-link" class="btn btn-outline-light">Log in</a>
    </div>
  </header>
  <main class="container mt-5 pt-5">
    <section id="newListingSection" class="mb-4" style="display:none;">
      <h2>Create a New Listing</h2>
      <form id="newListingForm" class="mb-3">
        <div class="mb-2">
          <input type="text" id="listingTitle" class="form-control" placeholder="Title" required>
        </div>
        <div class="mb-2">
          <input type="datetime-local" id="listingEndsAt" class="form-control" placeholder="Ends at" required>
        </div>
        <div class="mb-2">
          <input type="url" id="listingMedia" class="form-control" placeholder="Media URL" required>
        </div>
        <div class="mb-2">
          <textarea id="listingDescription" class="form-control" placeholder="Description"></textarea>
        </div>
        <button type="submit" class="btn btn-success">Create Listing</button>
      </form>
    </section>

    <section class="feedCointainer d-flex flex-wrap justify-content-between my-4"></section>
  </main>
  <footer class="footer mt-auto section-grey text-center p-3">
    <p>Auction Network Society</p>
    <p>2025</p>
    <p>&copy; Håvard Vavik</p>
  </footer>
  <script type="module" src="/js/index.mjs"></script>
</body>
</html>
