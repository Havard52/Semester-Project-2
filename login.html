<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANS | Log in or Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="src/scss/styles.css">
</head>
<body>
  <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <a href="index.html" id="logo"><h1>ANS</h1></a>
    <div id="user-info">
      <a href="login.html" id="login-link" class="btn btn-outline-primary">Log in</a>
    </div>
  </header>
  <main class="container my-5">
    <h2 class="text-center">Log in or Register</h2>
    <p class="text-center">Register now and get 1,000 free credits</p>
    <ul class="nav nav-tabs" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Login</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Register</button>
      </li>
    </ul>
    <div class="tab-content mt-3">
      <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
        <form id="loginForm">
          <div class="mb-3">
            <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
      </div>
      <div class="tab-pane fade" id="register-pane" role="tabpanel">
        <form id="registerForm">
          <div class="mb-3">
            <input type="text" class="form-control" id="registerName" placeholder="Username (letters and numbers only)" required>
            </div>
          <div class="mb-3">
            <input type="email" class="form-control" id="registerEmail" placeholder="Email (@stud.noroff.no)" required>
          </div>
            <div class="mb-3">
            <input type="password" class="form-control" id="registerPassword" placeholder="Password (min 8 chars)" required>
          </div>
          <div class="mb-3">
             <input type="password" class="form-control" id="registerPasswordRepeat" placeholder="Repeat Password" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
      </div>
    </div>
    <div id="authMessage" class="mt-3"></div>
  </main>
  <footer class="section-grey text-center footer">
    <p>Auction Network Society</p>
    <p>2025</p>
    <p>&copy; Håvard Vavik</p>
  </footer>
  <script type="module" src="/js/auth.mjs"></script>
</body>
</html>
